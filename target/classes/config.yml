xray:
  # Disable the xray logger by leaving `blocks` blank
  blocks:
    - diamond_ore
    - deepslate_diamond_ore
    - ancient_debris

  # The notification uses the CXYZ ChatChannel system.
  notification:
    channel: "staff"
    message: "{player} mined {block} at {block-x}, {block-y}, {block-z} in {world}"

# Amount of time (in seconds) before a player can safely log off after getting combat tagged
combat-logger-seconds: 10

# Amount of playtime (in seconds) that a player will be protected from PVP damage upon their first ever join
newbie-protection: 14400

# Amount of time (in seconds) that a player will be protected from all damage upon their join
spawn-protection: 10

# If true, entering ender portals will not transfer you to the end
disable-end: true

# For join/leave, server start, achievement and chat messages. (xray notifications a cxyz ChatChannel with a webhook enabled)
public-webhook-url: ""

# Lifesteal module
lifesteal:
  enabled: false

  hp: # 1HP = 0.5❤
    # MUST BE INTEGERS
    gain: 2 # Configure the amount of HP gained upon killing of a player (taken from the victim)
    max: 80 # The maximum amount of HP a player can stack

  kill-actions: # These commands execute when an attacker kills a player and steals one of their hearts. Use placeholders: {player}, {killer}, {player-hp}, {killer-hp}
      - show {killer} &4You stole one of {player}'s hearts!
      - show {player} &4{killer} stole one of your hearts!

  final-kill-actions: # These commands execute when an attacker kills a player and removes their final hearts. Use placeholders: {player}, {killer}, {player-hp}, {killer-hp}
    - lifesteal setmaxhp {player} 20
    - show {killer} &4You stole {player}'s final heart!
    - ban {player} 3d All your hearts have been stolen! Your hearts will be reset when this ban expires!
